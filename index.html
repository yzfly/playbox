<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="description" content="童年游戏盒：开源、免费、无广告的手机网页小游戏合集">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>童年游戏盒 PlayBox</title>
<link rel="stylesheet" href="shared/ui.css">
<style>
body { min-height: 100dvh; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
.hero { padding: calc(26px + env(safe-area-inset-top)) 0 14px; }
.hero h1 { margin: 0; font-size: 28px; letter-spacing: 1px; font-weight: 800;
  background: linear-gradient(90deg, #9fe8ff, #7c8cff 55%, #c38bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 6px 0 0; color: var(--dim); font-size: 14px; }
.search { margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
.search input { flex: 1; background: none; border: 0; outline: none; color: var(--text); font: 15px var(--font); padding: 12px 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13px; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
h2.sec { font-size: 15px; color: var(--dim); font-weight: 600; margin: 18px 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.card { display: block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform .12s; }
.card:active { transform: scale(.97); }
.cover { height: 104px; display: grid; place-items: center; position: relative; overflow: hidden; }
.cover::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.28), transparent 55%); }
.cover span { font-size: 50px; color: #fff; text-shadow: 0 6px 18px rgba(0,0,0,.3); font-family: "Noto Serif CJK SC", "Songti SC", "Noto Sans Symbols 2", serif; font-weight: 700; z-index: 1; }
.meta { padding: 10px 12px 12px; }
.meta b { display: block; font-size: 15px; }
.meta small { display: block; color: var(--dim); font-size: 12px; margin-top: 3px; line-height: 1.45; min-height: 34px; }
.tags { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.tags i { font-style: normal; font-size: 11px; color: #b9c3dc; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.recent { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.recent a { flex: none; display: flex; align-items: center; gap: 8px; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; font-size: 14px; }
.recent a em { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-style: normal; color: #fff; font-size: 16px; }
.empty { color: var(--dim); font-size: 14px; padding: 20px 0; text-align: center; }
footer { margin-top: 28px; color: var(--dim); font-size: 12px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>童年游戏盒</h1>
    <p>开源 · 免费 · 无广告 · 打开即玩</p>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜索游戏" autocomplete="off"></label>
    <nav class="chips" id="chips"></nav>
  </header>
  <section id="recentSec" hidden><h2 class="sec">最近玩过</h2><div class="recent" id="recent"></div></section>
  <h2 class="sec" id="allTitle">全部游戏</h2>
  <div class="grid" id="grid"></div>
  <footer>童年游戏盒 PlayBox · MIT 开源<br>所有游戏均为原创实现，进度只保存在本机</footer>
</div>
<script src="shared/ui.js"></script>
<script src="games.js"></script>
<script>
'use strict';
const games = window.PB_GAMES, grid = document.getElementById('grid'), q = document.getElementById('q');
const cats = ['全部', ...new Set(games.map(g => g.cat))];
let cat = '全部';
const chips = document.getElementById('chips');
cats.forEach(c => {
  const b = document.createElement('button'); b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.classList.toggle('on', x === b)); render(); };
  chips.appendChild(b);
});
function card(g) {
  const a = document.createElement('a'); a.className = 'card'; a.href = `games/${g.id}/`;
  a.innerHTML = `<div class="cover" style="background:linear-gradient(135deg,${g.c1},${g.c2})"><span></span></div><div class="meta"><b></b><small></small><div class="tags"></div></div>`;
  a.querySelector('.cover span').textContent = g.glyph;
  a.querySelector('b').textContent = g.name; a.querySelector('small').textContent = g.desc;
  const tg = a.querySelector('.tags'); [g.cat, ...g.tags].forEach(t => { const i = document.createElement('i'); i.textContent = t; tg.appendChild(i); });
  return a;
}
function render() {
  const kw = q.value.trim().toLowerCase();
  const list = games.filter(g => (cat === '全部' || g.cat === cat) && (!kw || (g.name + g.desc + g.cat + g.id).toLowerCase().includes(kw)));
  grid.replaceChildren(...list.map(card));
  if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '没有找到相关游戏'; grid.appendChild(e); }
  document.getElementById('allTitle').textContent = cat === '全部' ? `全部游戏 · ${list.length}` : `${cat} · ${list.length}`;
}
q.addEventListener('input', render);
const recent = PB.store.get('recent', []).map(id => games.find(g => g.id === id)).filter(Boolean);
if (recent.length) {
  document.getElementById('recentSec').hidden = false;
  const box = document.getElementById('recent');
  recent.forEach(g => {
    const a = document.createElement('a'); a.href = `games/${g.id}/`;
    a.innerHTML = `<em style="background:linear-gradient(135deg,${g.c1},${g.c2})"></em><span></span>`;
    a.querySelector('em').textContent = g.glyph; a.querySelector('span').textContent = g.name; box.appendChild(a);
  });
}
render();
</script>
</body>
</html>
